name: Local CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt -r requirements-model.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q app.py inference.py RRDBNet_arch.py tests
      - run: node --check static/uploads.js
